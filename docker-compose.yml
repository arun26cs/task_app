services:

  # ---- PostgreSQL Database ----
  postgres:
    image: postgres:16
    container_name: task-postgres
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - task-network

  # ---- Spring Boot Backend ----
  task-service:
    build:
      context: ./002_task_service
      dockerfile: Dockerfile
    container_name: task-service
    env_file: .env
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - task-network

  # ---- Angular Frontend ----
  task-ui:
    build:
      context: ./002_task_ui
      dockerfile: Dockerfile
    container_name: task-ui
    ports:
      - "80:80"
    depends_on:
      - task-service
    networks:
      - task-network

volumes:
  pgdata:

networks:
  task-network:
    driver: bridge
